## ✨ Features

*   **Lossless Raw PCM Audio:** No compression artifacts. Streams high-fidelity `16-bit` stereo audio at `48,000 Hz` (matching CD/Studio quality).
*   **Sub-100ms Latency:** Utilizes custom-coded, high-performance ring buffering and **Web Audio API Worklets** with self-healing latency compensation (automatic jump-ahead and resyncing on buffer accumulation).
*   **Zero-Install Client:** Works on iOS, Android, and other computers simply by scanning a QR code generated directly inside the server's terminal console.
*   **Dual Playback Mode:** Dynamically toggle whether system audio plays on both the PC and the phone simultaneously, or mutes the PC speaker to play only on the client device.
*   **Smart Device Management:** 
    *   Saves and restores original Windows mute states automatically.
    *   Stops recording audio input in Python when no clients are connected, minimizing CPU footprint to near 0%.
*   **Legacy Browser Fallback:** Seamlessly degrades to an optimized script-processor pipeline for browsers without AudioWorklet support or insecure/HTTP local network origins.

