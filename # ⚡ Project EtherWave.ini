## 🚀 Getting Started

No manual environment setup is required. The launcher script takes care of the workspace isolation, dependencies, and execution.

1.  Clone or download this repository to your local machine.
2.  Double-click **`Launch_EtherWave.bat`**. The launcher will:
    *   Verify your Python installation.
    *   Create a virtual environment (`.venv`) if it doesn't exist.
    *   Install the required dependencies (`sounddevice`, `numpy`, `websockets`, `qrcode`, `PyAudioWPatch`, `pycaw`, `comtypes`) silently.
    *   Execute `app.py`.
3.  A **QR Code** will be printed in the command prompt window along with the local IP address (e.g., `http://192.168.1.15:9090`).
4.  Scan the QR code with your phone or open the URL in your browser.
5.  Press **`Connect Stream`** on the web page to activate audio.

---

## ⌨️ Console Interactive Commands

While the python server is running in the terminal:
*   Press **`d`** and hit **`Enter`** to instantly toggle **Dual Playback** (activate or deactivate PC speaker mute).
*   Press **`Ctrl + C`** to gracefully shutdown the server, restore your laptop's original volume configurations, and terminate processes.

