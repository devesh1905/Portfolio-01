## 🛠️ Architecture Flow

The system captures audio at the kernel level using WASAPI loopback, packets it into binary chunks, and transmits it over high-speed WebSockets.

```mermaid
graph TD
    subgraph "Windows PC (Host Server)"
        A[Windows Audio Session API - WASAPI] -->|Loopback Record| B(PyAudioWPatch)
        B -->|PCM Float32 to Int16 Conversion| C(Python app.py)
        C -->|Web Server - Port 9090| D[Serve static index.html]
        C -->|WebSocket Server - Port 9091| E[Broadcast Binary Payloads]
        F(PyCaw API) <-->|Auto Mute / Dual Playback Control| C
    end

    subgraph "Client Device (Mobile Browser)"
        D -->|HTTP Request| G[Browser Web Page UI]
        E -->|WebSockets connection| H[Ring Buffer]
        H -->|Audio Worklet / ScriptProcessor| I[Web Audio API DAC]
        I -->|Output| J((Speakers/Headphones))
        I -->|Visualizer Frame Data| K[Canvas UI Waveform & VU Meters]
    end
```

