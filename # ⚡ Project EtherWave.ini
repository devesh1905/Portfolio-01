## 📋 Prerequisites

*   **Host System:** Windows 10 or 11
*   **Python:** Version 3.10 or higher
*   **Network:** Both the PC and client must be on the same local area network (LAN). A **5GHz Wi-Fi** or Ethernet network is highly recommended to prevent packet jitter.

---

## 🔧 System Calibration

For bit-perfect streaming and minimum latency, calibrate your Windows Audio settings:

1.  Press `Win + R`, type **`mmsys.cpl`**, and hit Enter to open Sound Settings.
2.  Right-click your **Default Speakers/Output Device** and choose **Properties**.
3.  Go to the **Advanced** tab and set the Default Format to:
    *   **`24-bit, 48000 Hz (Studio Quality)`** or **`16-bit, 48000 Hz`** (matches the `48000 Hz` internal sample rate).
4.  Navigate to the **Enhancements** (or Spatial Sound) tab and check **`Disable all enhancements`** (bypasses OS processing delay).

