# ⚡ Project EtherWave

**Ultra-Low-Latency Lossless Audio Streamer**  
Stream bit-perfect, uncompressed system audio from your Windows PC to any device's browser over Wi-Fi.

---

Project EtherWave is an open-source utility designed to capture your Windows system audio in real-time and stream it losslessly to a mobile phone, tablet, or secondary computer. Operating without proprietary client apps, it leverages WebSockets and the Web Audio API to play audio with sub-100ms latency directly inside any modern web browser.

It features a hardware-inspired user interface influenced by Swedish audio engineering aesthetics (**Teenage Engineering** style), containing a live canvas waveform visualizer, independent stereo volume meters, and real-time network diagnostic statistics.

